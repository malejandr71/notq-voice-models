name: Publish lesson-tutor models
on:
  push:
    branches: [main]
    paths: [.github/workflows/tutor-release.yml]
  workflow_dispatch:
permissions:
  contents: write
env:
  TAG: tutor-2026-10-29
  SRC: https://www.kaggle.com/api/v1/datasets/download/mahmoudmagdyokaab/notq-tutor-gguf
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if this release already exists (released files never change)
        id: check
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; else echo "exists=0" >> "$GITHUB_OUTPUT"; fi
      - name: Download from the public Kaggle dataset and verify checksums
        if: steps.check.outputs.exists == '0'
        run: |
          mkdir dist && cd dist
          for f in notq-tutor-lfm25-350m-Q4_0.gguf notq-tutor-lfm25-1.2b-Q4_0.gguf; do
            curl -fsSL --retry 5 -o "$f" "$SRC/$f"
          done
          cat > SHA256SUMS <<'SUMS'
          f4cdba23c285a31c2bd32f69bfc8e4cdb3ad3cb05e54f673d7186140c96fca57  notq-tutor-lfm25-350m-Q4_0.gguf
          7952eb12d797b1b752ee1b73cf965e2d61814ede6c4e5b148155e4eed9aa896c  notq-tutor-lfm25-1.2b-Q4_0.gguf
          SUMS
          sed -i 's/^ *//' SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish release
        if: steps.check.outputs.exists == '0'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --title "Lesson-tutor models ($TAG)" \
            --notes "Notq lesson tutor: LiquidAI LFM2.5-350M and LFM2.5-1.2B-Instruct fine-tuned on synthetic tutor conversations (teacher Qwen3-8B, Apache-2.0), quantised to Q4_0 with llama.cpp. Licence: LFM Open License v1.0 (Liquid AI)."
